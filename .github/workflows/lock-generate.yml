name: Generate Dependency Locks (temporary)

on:
  push:
    branches:
      - feature/ddc-core-bootstrap

permissions:
  contents: write

jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, '[lockgen]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned lock toolchain
        run: python -m pip install "pip==26.1.2" "pip-tools==7.6.0"
      - name: Compile runtime lock
        run: >-
          python -m piptools compile
          --resolver=backtracking
          --generate-hashes
          --strip-extras
          --allow-unsafe
          --output-file=requirements.txt
          requirements.in
      - name: Compile development lock
        run: >-
          python -m piptools compile
          --resolver=backtracking
          --generate-hashes
          --strip-extras
          --allow-unsafe
          --output-file=requirements-dev.txt
          requirements-dev.in
      - name: Verify hash-locked installation
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Test locked environment
        run: |
          python -m pytest -q
          python -m ruff check .
          python -m mypy
      - name: Commit locks
        shell: bash
        run: |
          if git diff --quiet -- requirements.txt requirements-dev.txt; then
            echo "Dependency locks already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- requirements.txt requirements-dev.txt
          git commit -m "[lockgen] Add Python 3.12 hashed dependency locks"
          git push origin HEAD:feature/ddc-core-bootstrap
