name: Ruff Autofix (temporary)

on:
  push:
    branches:
      - feature/ddc-core-bootstrap

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[ruff-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff==0.15.20"
      - name: Apply safe Ruff fixes
        run: python -m ruff check daily_data_core tests --fix
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet -- daily_data_core tests; then
            echo "No Ruff fixes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- daily_data_core tests
          git commit -m "[ruff-autofix] Apply Ruff safe fixes"
          git push origin HEAD:feature/ddc-core-bootstrap
