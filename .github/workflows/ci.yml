name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned bootstrap toolchain
        run: python -m pip install "pip==26.1.2" "pip-tools==7.6.0"
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify dependency locks are current
        shell: bash
        run: |
          python -m piptools compile \
            --resolver=backtracking \
            --generate-hashes \
            --strip-extras \
            --allow-unsafe \
            --output-file=requirements.txt \
            requirements.in
          python -m piptools compile \
            --resolver=backtracking \
            --generate-hashes \
            --strip-extras \
            --allow-unsafe \
            --output-file=requirements-dev.txt \
            requirements-dev.in
          git diff --exit-code -- requirements.txt requirements-dev.txt
      - name: Pytest
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy
