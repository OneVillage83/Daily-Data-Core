name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install compiler toolchain
        if: hashFiles('requirements-dev.in') != ''
        run: python -m pip install "pip==26.1.2" "pip-tools==7.6.0"
      - name: Install dependencies
        if: hashFiles('requirements-dev.in') != ''
        run: python -m pip install -r requirements-dev.in
      - name: Pytest
        if: hashFiles('requirements-dev.in') != ''
        run: python -m pytest -q
      - name: Ruff
        if: hashFiles('requirements-dev.in') != ''
        run: python -m ruff check .
      - name: Mypy
        if: hashFiles('requirements-dev.in') != ''
        run: python -m mypy
