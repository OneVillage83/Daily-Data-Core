[project]
name = "daily-data-core"
version = "0.1.0"
description = "Shared sport-agnostic data foundation for The Daily Line"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["daily_data_core"]
