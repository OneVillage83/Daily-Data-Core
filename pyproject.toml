[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-data-core"
version = "0.2.0.dev2"
description = "Shared sport-agnostic data infrastructure for The Daily Line"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests==2.33.0",
    "tzdata==2026.3",
]

[tool.setuptools.packages.find]
include = ["daily_data_core*"]

[tool.setuptools.package-data]
daily_data_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
exclude = '(^|[\\/])(build|dist|\.validation)[\\/]'
packages = ["daily_data_core"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
